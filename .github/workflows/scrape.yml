name: Scrape and clean stat.uz data

# Runs once when the scripts or dataset list are pushed, and on demand from the
# Actions tab ("Run workflow"). To update monthly, uncomment the schedule below.
on:
  push:
    branches: [main]
    paths:
      - "scrape.py"
      - "clean.py"
      - "datasets.csv"
      - ".github/workflows/scrape.yml"
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 10 * *"  # 10th of every month, 06:00 UTC

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download raw data
        run: python scrape.py

      - name: Clean data
        run: python clean.py

      - name: Report data size
        run: |
          echo "::notice::data folder: $(du -sh data | cut -f1), $(find data -type f | wc -l) files"
          echo "::notice::largest files: $(find data -type f -printf '%s %p\n' | sort -rn | head -3 | awk '{printf "%s (%.1f MB); ", $2, $1/1048576}')"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data."
            exit 0
          fi
          git commit -q -m "Update stat.uz data ($(date -u +%Y-%m-%d))"
          if ! git push 2> push_error.txt; then
            echo "::error::git push failed: $(tr '\n' ' ' < push_error.txt | cut -c1-900)"
            exit 1
          fi
